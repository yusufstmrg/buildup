# Mutations

mutation CreateOrganization($name: String!, $uid: String @retired) @auth(level: USER) @transaction {
  org: organization_insert(data: { name: $name })
  mem: membership_insert(data: {
    organizationId_expr: "response.org.id",
    userId_expr: "auth.uid",
    role: "OWNER"
  })
}

mutation UpdateGenomeMetric(
  $orgId: UUID!, 
  $dimension: String!, 
  $metricKey: String!, 
  $metricValue: Float!, 
  $provenance: String
) @auth(level: USER) @transaction {
  query @redact {
    membership(key: { organizationId: $orgId, userId_expr: "auth.uid" }) 
      @check(expr: "this != null", message: "Unauthorized") {
      role
    }
  }
  businessGenome_insert(data: {
    organizationId: $orgId,
    dimension: $dimension,
    metricKey: $metricKey,
    metricValue: $metricValue,
    provenance: $provenance
  })
}

mutation CreateInitiative(
  $orgId: UUID!,
  $title: String!,
  $description: String,
  $department: String!,
  $ownerId: String @retired,
  $expectedRoi: Float
) @auth(level: USER) @transaction {
  query @redact {
    membership(key: { organizationId: $orgId, userId_expr: "auth.uid" }) 
      @check(expr: "this != null", message: "Unauthorized") {
      role
    }
  }
  initiative_insert(data: {
    organizationId: $orgId,
    title: $title,
    description: $description,
    department: $department,
    ownerId_expr: "auth.uid",
    status: "PROPOSED",
    expectedRoi: $expectedRoi
  })
}

