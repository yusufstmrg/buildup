# Queries

query GetUserOrganizations($uid: String @retired) @auth(level: USER) {
  memberships(where: { userId: { eq_expr: "auth.uid" } }) {
    role

    organization {
      id @retired
      name
      createdAt
    }
  }
}

# The following queries filter records by joining with the Membership table
# to ensure the current user (auth.uid) belongs to the requested organization.

query GetBusinessProfile($orgId: UUID!) @auth(level: USER) {
  businessProfiles(where: { 
    organizationId: { eq: $orgId },
    organization: {
      memberships_on_organization: {
        exist: { userId: { eq_expr: "auth.uid" } }
      }
    }
  }) {
    id
    industry
    revenueRange
    headcount
    currency
  }
}

query GetBusinessGenome($orgId: UUID!) @auth(level: USER) {
  businessGenomes(where: { 
    organizationId: { eq: $orgId },
    organization: {
      memberships_on_organization: {
        exist: { userId: { eq_expr: "auth.uid" } }
      }
    }
  }) {
    id
    dimension
    metricKey
    metricValue
    confidence
    provenance
    lastUpdated
  }
}

query GetInitiatives($orgId: UUID!) @auth(level: USER) {
  initiatives(
    where: { 
      organizationId: { eq: $orgId },
      organization: {
        memberships_on_organization: {
          exist: { userId: { eq_expr: "auth.uid" } }
        }
      }
    }, 
    orderBy: { expectedRoi: DESC }
  ) {
    id
    title
    description
    status
    expectedRoi
    department
    owner {
      displayName
      email
    }
  }
}
