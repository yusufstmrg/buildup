<script> const A='/assets/buildup-logo.png';const nav=[ ['COMMAND','Command Center','dashboard'],['','Business Health','health'],['','Score / X-Ray','xray'],['','Business Context','context'],['INTELLIGENCE','Intelligence™','intelligence'],['','Decisions','decisions'],['EXECUTE','Transformation','transformation'],['','Workflows','workflows'],['','AI Workforce','agents'],['BUSINESS FUNCTIONS','Finance','finance'],['','Sales','sales'],['','Operations','operations'],['','People / HRGA','people'],['','Procurement','procurement'],['','Risk & Compliance','risk'],['','Strategy','strategy'],['IMPROVE','Reports','reports'],['','Expert Network','experts'],['INTEGRATIONS','Integration Hub','integrations'],['GOVERNANCE','Settings','settings'] ];const state={score:+localStorage.getItem('bu_score')||67,connected:localStorage.getItem('bu_connected')==='1'};function logo(c=''){return `<img class="logo ${c}" src="${A}" alt="BuildUp — Business Transformation Partner">`} function btn(t,go,c=''){return `<button class="btn ${c}" data-go="${go}">${t}</button>`} function landing(){return `<div class="landing"><header class="landnav">${logo()}<nav class="landlinks"><a href="#journey">Journey</a><a href="#intelligence">Intelligence™</a><a href="#os">Business OS™</a><a href="#agents">AI Workforce</a></nav><div>${btn('Login','dashboard','ghost')} ${btn('Get Started','score','gold')}</div></header><section class="hero"><div class="hero-inner"><div><div class="eyebrow">Business Transformation Partner</div><h1>Build Better Businesses.<br><span>Build Businesses That Last.</span></h1><p>Your ERP runs the business. BuildUp makes the business intelligent. Connect the existing stack, understand what is happening, make better decisions, and transform with measurable impact.</p><div class="hero-actions">${btn('Take Health Check™ →','score','gold')}${btn('Open Business Command Center','dashboard','ghost')}</div></div><div class="hero-card"><b>BuildUp Health Check™</b><div class="score">${state.score}<small style="font-size:14px;color:#6d7784"> / 100</small></div><div class="scorebar"><i></i></div><p style="font-size:11px;color:#66727e;line-height:1.6">Directional health snapshot. Connect business systems for validated intelligence.</p>${btn('Start Assessment →','score','gold')}</div></div></section><section class="land-section" id="journey"><div class="land-wrap"><div class="section-head"><div><div class="eyebrow">End-to-End Customer Journey</div><h2>Connect → Understand → Transform.</h2></div><p>One integrated experience from free Health Check to continuous intelligence and improvement.</p></div><div class="journey">${[['1','Connect','Existing business stack'],['2','Health Check','Free snapshot'],['3','X-Ray','Root-cause diagnostic'],['4','360','Cross-functional assessment'],['5','Transformation','PM + experts + technology'],['6','Intelligence','Continuous decisions'],['7','Business OS','Workflow orchestration'],['8','AI Workforce','Departmental agents']].map(x=>`<div><b>${x[0]}. ${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div></div></section><section class="land-section dark-section" id="intelligence"><div class="land-wrap"><div class="section-head"><div><div class="eyebrow">North Star Architecture</div><h2>One intelligence layer above your stack.</h2></div><p style="color:#aab6c2">ERP = System of Record · BuildUp Intelligence™ = Understanding + Decision · Business OS™ = Orchestration · Human Command = Accountability.</p></div><div class="pillars"><div class="pillar"><b>ERP / Existing Systems</b><span>System of Record. SAP, Oracle, Dynamics, Odoo, accounting, CRM, HRIS, banking, POS and files.</span></div><div class="pillar"><b>BuildUp Intelligence™</b><span>Context, evidence, root cause, scenarios, recommendations and decision intelligence.</span></div><div class="pillar"><b>BuildUp Business OS™</b><span>Workflows, approvals, transformation execution, monitoring and controlled orchestration.</span></div><div class="pillar"><b>Human Command</b><span>Leadership remains final authority for material decisions and high-impact execution.</span></div></div></div></section><section class="land-section" id="os"><div class="land-wrap"><div class="section-head"><div><div class="eyebrow">Production Product Architecture</div><h2>Built for the real business.</h2></div><p>Read-only by default, tenant-isolated, role-based, auditable, and designed to expand from diagnostics into governed execution.</p></div><div class="pillars"><div class="pillar"><b>Health Check™</b><span>Fast screening and prioritized signals.</span></div><div class="pillar"><b>Business X-Ray™</b><span>Paid diagnostic for root cause, leakage, risk and opportunity.</span></div><div class="pillar"><b>Context Graph</b><span>Canonical business relationships across systems.</span></div><div class="pillar"><b>Decision Engine</b><span>What happened, why, what matters and what next.</span></div><div class="pillar"><b>Business OS™</b><span>Execution layer with approvals and controls.</span></div><div class="pillar"><b>AI Workforce</b><span>Finance, Procurement, Sales, Operations, Risk and Strategy agents.</span></div></div></div></section><section class="land-section dark-section" id="agents"><div class="land-wrap"><div class="section-head"><div><div class="eyebrow">Human + AI</div><h2>AI recommends. Humans command.</h2></div><p style="color:#aab6c2">Autonomy increases only as financial impact, strategic consequence, reputational risk, uncertainty and irreversibility decrease.</p></div>${btn('Enter Command Center →','dashboard','gold')}</div></section><footer class="landfoot"><div class="land-wrap"><div>${logo('sm')}<div style="margin-top:8px;font-size:9px">Business Transformation Partner · Build Better Businesses. Build Businesses That Last.</div></div><div style="font-size:9px">© 2026 BuildUp</div></div></footer></div>`} function sidebar(page){let last='';return `<aside class="sidebar" id="sidebar">${logo()}<div class="tenant"><b>PT Maju Bersama</b><small>Enterprise Plan · Owner</small></div><div class="snav">${nav.map(x=>{if(x[0]&&x[0]!==last){last=x[0];return `<div class="group">${x[0]}</div><button class="${page===x[2]?'active':''}" data-page="${x[2]}"><i class="dot"></i>${x[1]}</button>`}return `<button class="${page===x[2]?'active':''}" data-page="${x[2]}"><i class="dot"></i>${x[1]}</button>`}).join('')}</div><div class="assistant"><b>BuildUp Assistant</b><span>Ask anything about your business.</span></div></aside>`} function kpi(a,b,c,down=false){return `<div class="kpi"><span>${a}</span><strong>${b}</strong><em class="${down?'down':'up'}">${c}</em></div>`} function radar(){return `<div class="radar"><svg viewBox="0 0 300 260"><polygon points="150,25 235,75 235,185 150,235 65,185 65,75" fill="none" stroke="rgba(255,255,255,.10)"/><polygon points="150,55 205,87 205,170 150,202 95,170 95,87" fill="none" stroke="rgba(255,255,255,.10)"/><polygon points="150,82 178,99 178,151 150,170 122,151 122,99" fill="none" stroke="rgba(255,255,255,.10)"/><polygon points="150,45 220,87 199,169 150,194 88,165 82,88" fill="rgba(224,165,47,.10)" stroke="#e0a52f" stroke-width="2"/><text x="145" y="17">Finance</text><text x="242" y="73">Sales</text><text x="239" y="197">Operations</text><text x="135" y="253">People</text><text x="37" y="198">Risk</text><text x="42" y="73">Strategy</text></svg></div>`} function dashboard(){return `<div class="head"><div><div class="eyebrow">Executive Workspace</div><h1>Business Command Center</h1><p>From data to decisions. From decisions to measurable impact.</p></div><div>${btn('+ New Insight','intelligence','gold')}</div></div><div class="kpis">${kpi('Business Health Score',state.score+'/100','↑ 6 vs last month')}${kpi('Revenue YTD','Rp 248.3 M','↑ 12.5%')}${kpi('Gross Margin','24.8%','↑ 2.1%')}${kpi('EBITDA','11.3%','↑ 1.8%')}${kpi('Cash Conversion','62 Days','↓ 8 days',true)}${kpi('Working Capital','Rp 54.1 M','↑ 18.3%')}${kpi('Transformation Value','Rp 3.42 M','↑ 26%')}</div><div class="grid-main"><section class="panel context"><h3>Business Context Graph</h3><span class="sub">Unified view across your business systems</span><div class="graph"><i class="gline a"></i><i class="gline b"></i><i class="gline c"></i><div class="gnode center">BUSINESS</div><div class="gnode gn1">Customer</div><div class="gnode gn2">Sales</div><div class="gnode gn3">Revenue</div><div class="gnode gn4">Inventory</div><div class="gnode gn5">Supplier</div><div class="gnode gn6">Cash</div></div></section><section class="panel"><h3>BuildUp Intelligence™</h3><span class="sub">What happened · Why · What matters · What next</span><div class="intel-grid" style="margin-top:10px">${[['WHAT HAPPENED?','Revenue grew 12.5%','Sales growth offset cost pressure.'],['WHY?','Supplier cost increased','3 suppliers drive 68% of purchase cost.'],['WHAT MATTERS?','Cash is tightening','Inventory days reached 62 days.'],['WHAT NEXT?','Renegotiate + optimize','Potential annual value Rp 4.8 M.']].map(x=>`<div class="intel-box"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></section><section class="panel brief-panel"><h3>Executive Brief <span class="tag gold">AI</span></h3><ol class="brief"><li><i class="num">1</i><span>Gross margin pressure is linked to higher raw material cost.</span></li><li><i class="num">2</i><span>Supplier concentration creates a clear negotiation opportunity.</span></li><li><i class="num">3</i><span>Inventory optimization can release working capital.</span></li><li><i class="num">4</i><span>Leadership approval is required for material actions.</span></li></ol>${btn('View Full Analysis →','intelligence')}</section></div><div class="grid-main"><section class="panel"><h3>Business Health Radar</h3>${radar()}</section><section class="panel"><h3>Recent Decision Objects</h3>${[['Renegotiate Supplier A','Rp 4.8 M','High Impact','For Approval'],['Optimize Slow-Moving Inventory','Rp 2.1 M','Medium Impact','In Review'],['Expand Customer Segment','Rp 12.4 M','High Impact','Draft']].map(x=>`<div class="decision-card"><b>${x[0]}</b><small>Estimated impact ${x[1]}</small><div class="tags"><span class="tag">${x[2]}</span><span class="tag gold">${x[3]}</span></div></div>`).join('')}</section><section class="panel"><h3>Requires Your Approval <span class="tag gold">3</span></h3>${['Supplier Contract Renewal','New Warehouse Investment','Hire Finance Controller'].map(x=>`<div class="decision-card"><b>${x}</b><small>Human Command approval required</small></div>`).join('')}</section></div><div class="grid-main"><section class="panel"><h3>ERP & System Integration</h3><div class="integration">${['SAP S/4HANA','Oracle NetSuite','Microsoft Dynamics','Accounting / Finance','Salesforce CRM','Google Drive'].map((x,i)=>`<div class="sys"><span>${x}</span><span class="status">${i===2?'Not Connected':'Connected'}</span></div>`).join('')}</div></section><section class="panel"><h3>Transformation Pipeline · Business OS™</h3><div class="pipeline">${[['Diagnose',12],['Decide',8],['Execute',6],['Measure',4],['Improve',3]].map((x,i)=>`<div class="stage"><b>${x[0]}</b><strong>${x[1]}</strong><small>${i<3?'Active initiatives':'Tracked initiatives'}</small><div class="progress" style="margin-top:10px"><i style="width:${35+i*13}%"></i></div></div>`).join('')}</div></section><section class="panel"><h3>Recent Activity</h3>${['AI insight generated','Data sync completed','Decision draft created','Workflow updated'].map((x,i)=>`<div class="decision-card"><b>${x}</b><small>${i+2} hours ago</small></div>`).join('')}</section></div><section class="panel" style="margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>AI Workforce</h3><span class="sub">Digital workforce with Human-in-the-Loop governance</span></div>${btn('Manage Agents →','agents')}</div><div class="agents" style="margin-top:10px">${[['Finance Agent','Cash & margin'],['Procurement Agent','Spend & suppliers'],['Sales Agent','Pipeline & forecast'],['Operations Agent','Efficiency'],['Risk Agent','Exposure & controls'],['Strategy Agent','Scenarios']].map(x=>`<div class="agent"><b>${x[0]}</b><small>${x[1]}</small><em>● Active · Recommend</em></div>`).join('')}</div></section>`} function generic(page){const names={health:['Business Health','Health signals across the business'],xray:['Score / X-Ray','Diagnostic path from signal to root cause'],context:['Business Context Graph','Canonical entities and economic relationships'],intelligence:['BuildUp Intelligence™','Continuous intelligence, scenarios and recommendations'],decisions:['Human Command','AI assists and recommends. Leadership retains final authority.'],transformation:['Transformation','Initiatives, owners, milestones and measurable value'],workflows:['Workflows','Governed execution, approvals and monitoring'],agents:['AI Workforce','Departmental agents sharing one canonical context'],finance:['Finance','Financial intelligence and working-capital management'],sales:['Sales','Pipeline, conversion and commercial intelligence'],operations:['Operations','Operational performance and bottlenecks'],people:['People / HRGA','Workforce capacity, KPI and people workflows'],procurement:['Procurement','Spend, supplier concentration and negotiation intelligence'],risk:['Risk & Compliance','Risk exposure, controls and compliance monitoring'],strategy:['Strategy','Scenarios, priorities and strategic decisions'],reports:['Reports','Executive reports, diagnostic outputs and audit trails'],experts:['Expert Network','Verified expert partners and transformation support'],integrations:['Integration Hub','Connect your existing business stack'],settings:['Settings','Tenant, users, roles, policies and governance']};const n=names[page]||names.dashboard;let cards=['Measure','Diagnose','Prioritize','Decide','Execute','Measure Impact','Learn','Improve'];if(page==='health')cards=['Finance & Cash Flow','Accounting & Reporting','Tax & Compliance','Sales & Growth','Operations','People & HRGA','Risk & Governance','Technology & AI'];if(page==='agents')cards=['Finance Agent','Procurement Agent','Sales Agent','Operations Agent','Risk Agent','Strategy Agent'];if(page==='integrations')cards=['SAP / ERP','Accounting / Finance','CRM','HRIS','Banking / POS','Spreadsheets / Files','Document Systems','Custom APIs'];return `<div class="head"><div><div class="eyebrow">BuildUp Platform</div><h1>${n[0]}</h1><p>${n[1]}</p></div>${btn('Command Center','dashboard')}</div><section class="panel"><div class="xgrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${cards.map((x,i)=>`<div class="decision-card" style="min-height:110px"><span class="tag ${i%3===0?'gold':''}">${String(i+1).padStart(2,'0')}</span><b style="display:block;margin-top:10px">${x}</b><small>${page==='integrations'?(i===2?'Not connected':'Ready · read-only by default'):'Evidence + context + governed action'}</small></div>`).join('')}</div></section>${page==='integrations'?`<section class="panel" style="margin-top:8px"><h3>Operating Mode</h3><div class="tags"><span class="tag green">OBSERVE · Read-only</span><span class="tag">RECOMMEND · Decision support</span><span class="tag gold">ORCHESTRATE · Approval required</span></div></section>`:''}`} function shell(page){return `<div class="workspace">${sidebar(page)}<main class="main"><header class="topbar"><div class="top-left"><button class="iconbtn mobile-menu" data-menu>☰</button><input class="search" placeholder="Search anything... e.g. revenue, customer risk, agent"><span class="tag gold">Enterprise Plan</span></div><div class="top-right"><button class="iconbtn" data-open-drawer>◌</button><button class="iconbtn">?</button><button class="iconbtn">⚙</button><div class="user"><div class="avatar">AY</div><span>Andi Wijaya<br><small style="color:#7f8c99">CEO</small></span></div></div></header><div class="content">${page==='dashboard'?dashboard():generic(page)}</div></main></div><div class="drawer" id="drawer"><div class="drawer-head"><b>BuildUp Assistant</b><button class="close" data-close-drawer>×</button></div><h2>How can I help?</h2><p style="font-size:10px;color:#8d9aa8">Ask about business health, root cause, decisions, workflows or transformation.</p><div class="panel" style="margin-top:15px"><b>Suggested prompts</b><div class="decision-card">Explain why margin changed.</div><div class="decision-card">What should leadership approve today?</div><div class="decision-card">Find working-capital opportunities.</div></div></div>${scoreModal()}</div>`} function scoreModal(){return `<div class="modal" id="scoreModal"><div class="modal-box"><div class="modal-top"><b>BuildUp Health Check™</b><button class="close" data-close-score aria-label="Close Health Check">×</button></div><div class="stepbar"><i class="step on"></i><i class="step"></i><i class="step"></i></div><div class="form" id="scoreForm"></div></div></div>`} const qs=[['FINANCE & CASH FLOW','How would you rate your current cash-flow management?'],['SALES & GROWTH','How consistently do you measure sales performance and growth?'],['OPERATIONS','How standardized and measurable are core operations?'],['PROCUREMENT','How effectively do you manage supplier cost and concentration?'],['PEOPLE','How clearly are people capacity and performance managed?'],['RISK & GOVERNANCE','How mature are your risk and control practices?'],['TECHNOLOGY & AI','How effectively does technology support the business?'],['STRATEGY','How consistently are strategic priorities translated into action?']];const opts=['Very Poor — no clear management system','Fair — several challenges remain','Good — generally manageable','Very Good — consistently managed','Excellent — optimized and continuously improved'];let qi=0,answers=[];function openScore(){const m=document.getElementById('scoreModal');if(!m)return;qi=0;answers=[];m.classList.add('open');history.pushState({score:true},'',location.pathname+'#score');renderQ()} function closeScore(){document.getElementById('scoreModal')?.classList.remove('open');if(location.hash==='#score')history.replaceState({},'',location.pathname+'#dashboard')} function renderQ(){const f=document.getElementById('scoreForm');const q=qs[qi];f.innerHTML=`<div class="qmeta">${q[0]} · Question ${qi+1} of ${qs.length}</div><div class="question">${q[1]}</div><div class="options">${opts.map((x,i)=>`<button class="option" data-answer="${i+1}">${x}</button>`).join('')}</div><div class="modal-foot"><button class="btn" data-back-score>${qi?'← Previous':'← Back to Command Center'}</button><span style="font-size:9px;color:#7c8792;align-self:center">Your answers are saved locally on this device.</span></div>`;f.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[qi]=+b.dataset.answer;if(qi<qs.length-1){qi++;document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('on',i<=Math.floor(qi/3)));renderQ()}else finishScore()});f.querySelector('[data-back-score]').onclick=()=>{if(qi){qi--;renderQ()}else closeScore()}} function finishScore(){const total=Math.round(answers.reduce((a,b)=>a+b,0)/(qs.length*5)*100);state.score=total;localStorage.setItem('bu_score',total);document.getElementById('scoreForm').innerHTML=`<div class="qmeta">Initial Business Health Snapshot</div><div class="question">Your BuildUp Health Score</div><div style="font-size:82px;font-weight:950;letter-spacing:-.07em;color:#b27c1a">${total}<small style="font-size:16px;color:#6f7a86"> / 100</small></div><p style="font-size:10px;color:#6f7a86;line-height:1.7">This Health Check is a directional screening. Production diagnostic outputs should be validated against connected business data and the applicable BuildUp methodology.</p><div class="modal-foot">${btn('Back to Command Center','dashboard')}${btn('Explore Business X-Ray™','xray','gold')}</div>`;document.querySelectorAll('#scoreForm [data-go]').forEach(b=>b.onclick=()=>{closeScore();go(b.dataset.go)})} function go(page){location.hash=page;render()} function render(){const hash=(location.hash||'').replace('#','');if(!hash||hash==='home'){document.getElementById('app').innerHTML=landing()}else if(hash==='score'){document.getElementById('app').innerHTML=shell('dashboard');openScore()}else{document.getElementById('app').innerHTML=shell(hash)}bind()} function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='score'){document.getElementById('app').innerHTML=shell('dashboard');bind();openScore();return}go(g)});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.getElementById('sidebar')?.classList.remove('open');go(b.dataset.page)});document.querySelector('[data-menu]')?.addEventListener('click',()=>document.getElementById('sidebar')?.classList.toggle('open'));document.querySelector('[data-open-drawer]')?.addEventListener('click',()=>document.getElementById('drawer')?.classList.add('open'));document.querySelector('[data-close-drawer]')?.addEventListener('click',()=>document.getElementById('drawer')?.classList.remove('open'));document.querySelector('[data-close-score]')?.addEventListener('click',closeScore);document.getElementById('scoreModal')?.addEventListener('click',e=>{if(e.target.id==='scoreModal')closeScore()})} window.addEventListener('hashchange',()=>{if(location.hash!=='#score')render()});window.addEventListener('popstate',()=>{if(!location.hash||location.hash==='#dashboard')closeScore()});render();</script>
