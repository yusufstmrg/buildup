<svg viewBox="0 0 400 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-gold-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4C2" />
      <stop offset="25%" stop-color="#F5CE58" />
      <stop offset="50%" stop-color="#D4A017" />
      <stop offset="75%" stop-color="#B37C0C" />
      <stop offset="100%" stop-color="#6C4702" />
    </linearGradient>
    <linearGradient id="g-gold-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E0" />
      <stop offset="35%" stop-color="#F7DA76" />
      <stop offset="70%" stop-color="#D9A826" />
      <stop offset="100%" stop-color="#966B08" />
    </linearGradient>
    <linearGradient id="g-gold-dark" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C99318" />
      <stop offset="40%" stop-color="#8C6207" />
      <stop offset="85%" stop-color="#4A3201" />
      <stop offset="100%" stop-color="#251800" />
    </linearGradient>
    <linearGradient id="g-silver-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="g-silver-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Group Emblem -->
  <g transform="translate(10, 15) scale(0.95)">
    <!-- Golden Ramp / Wedge -->
    <polygon points="12,72 26,72 26,52" fill="url(#g-gold-1)" filter="url(#shadow)" />
    <polygon points="12,72 26,52 24,51 11,70" fill="url(#g-gold-light)" />
    <!-- Silver Pillar Left -->
    <polygon points="30,72 40,72 40,36 30,48" fill="url(#g-silver-1)" filter="url(#shadow)" />
    <polygon points="30,48 40,36 41,37 31,49" fill="url(#g-silver-light)" />
    <!-- Silver Pillar Right -->
    <polygon points="44,72 55,72 55,22 44,34" fill="url(#g-silver-1)" filter="url(#shadow)" />
    <polygon points="44,34 55,22 56,23 45,35" fill="url(#g-silver-light)" />
    <!-- Golden 3D Monogram B -->
    <path d="M44,12 H70 C79,12 85,17 85,26 C85,33 80,38 72,40 C83,43 89,50 89,61 C89,72 80,78 68,78 H46 L46,68 H67 C73,68 78,64 78,57 C78,50 73,46 65,46 H54 L44,46 V12 Z" fill="url(#g-gold-1)" filter="url(#shadow)" />
    <path d="M57,21 H68 C73,21 76,23 76,27 C76,31 73,33 68,33 H57 V21 Z" fill="url(#g-gold-dark)" />
    <path d="M57,48 H66 C72,48 77,52 77,58 C77,64 72,67 66,67 H57 V48 Z" fill="url(#g-gold-dark)" />
  </g>

  <!-- Wordmark BuildUp -->
  <text x="115" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#g-silver-1)" letter-spacing="-1">Build</text>
  <text x="245" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#g-gold-1)" letter-spacing="-1">Up</text>

  <!-- Horizontal Subtitle Rule & Text -->
  <line x1="115" y1="92" x2="135" y2="92" stroke="#D4AF37" stroke-width="1.2" />
  <text x="145" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#D4AF37" letter-spacing="3.5">BUSINESS TRANSFORMATION PARTNER</text>
  <line x1="375" y1="92" x2="395" y2="92" stroke="#D4AF37" stroke-width="1.2" />
</svg>
